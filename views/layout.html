<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfa | تحليل متجرك بذكاء</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#ecfdf9', 100:'#d1faf0', 400:'#5eead4', 500:'#2dd4bf', 600:'#0d9488', 700:'#0f766e' },
            ink:   { 700:'#1e293b', 800:'#0f172a', 900:'#020617' },
          },
          boxShadow: { glow: '0 0 30px -5px rgba(45,212,191,0.4)' },
          animation: { 'fade-up':'fadeUp 0.5s ease-out', 'fade-in':'fadeIn 0.4s ease-out' },
          keyframes: {
            fadeUp:{'0%':{opacity:0,transform:'translateY(10px)'},'100%':{opacity:1,transform:'translateY(0)'}},
            fadeIn:{'0%':{opacity:0},'100%':{opacity:1}},
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: linear-gradient(180deg, #020617 0%, #0f172a 100%); min-height: 100vh; color: #e2e8f0; }
    .glass { background: rgba(15,23,42,0.6); backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,0.1); }
    .grad-text { background: linear-gradient(135deg,#2dd4bf 0%,#60a5fa 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .grad-bg { background: linear-gradient(135deg,#0d9488 0%,#2563eb 100%); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="antialiased">

<nav class="glass sticky top-0 z-50 border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl grad-bg flex items-center justify-center text-white font-black text-lg shadow-glow">A</div>
        <div>
          <div class="text-white font-bold text-lg leading-tight">Alfa</div>
          <div class="text-xs text-slate-400 leading-tight">تحليل متجرك بذكاء</div>
        </div>
      </a>

      {% if isLogin %}
      <div class="hidden md:flex items-center gap-1">
        <a href="/" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition">الرئيسية</a>
        <a href="/analysis" class="px-4 py-2 rounded-lg text-sm font-semibold text-brand-400 hover:bg-brand-500/10 transition">📊 التحليل</a>
        <a href="/logout" class="mr-2 px-4 py-2 rounded-lg text-sm font-semibold text-rose-400 hover:bg-rose-500/10 transition">خروج</a>
      </div>
      {% else %}
      <a href="/login" class="grad-bg text-white px-6 py-2 rounded-lg text-sm font-bold hover:opacity-90 transition shadow-glow">تثبيت التطبيق</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="animate-fade-in">
  {% block content %}{% endblock %}
</main>

<footer class="border-t border-slate-800 mt-20 py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <p class="text-sm text-slate-500">
      صُنع لمتاجر سلة •
      <a href="https://salla.dev" class="text-brand-400 hover:text-brand-500 transition">Salla Developers</a>
    </p>
  </div>
</footer>

<!-- Live preview of the storefront widget (demo mode) -->
<script src="/widget.js?store=demo" async></script>

</body>
</html>
